name: PixelProof Companion CI

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/**"
      - "launcher/**"
      - "launcher-macos/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    paths:
      - "companion/**"
      - "launcher/**"
      - "launcher-macos/**"
      - "tests/**"
      - "package*.json"

jobs:
  companion-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/release_static_check.cjs
      - run: npm run test:companion
